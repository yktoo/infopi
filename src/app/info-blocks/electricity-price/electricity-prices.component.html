<div class="ruler-top">
    <h2>Electricity price</h2>
</div>
<div class="row flex-start">
    @for (day of days; track day.addDays) {
        <div class="w-6 pl-1 pr-2">
            <h3 class="mt-0">{{ day.label }}</h3>
            <app-electricity-price
                [config]="config()"
                [addDays]="day.addDays"
                [yRange]="yRange()"
                (priceRangeChange)="setRange(day.addDays, $event)"/>
        </div>
    }
</div>
